[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pictostory"
version = "0.1.0"
description = "Annotation d'histoires en pictogrammes pour les enfants TSA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "spacy>=3.7,<4",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
pictostory = "pictostory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_model: nécessite le modèle spaCy français"]
